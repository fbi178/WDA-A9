name: Build Tweak (Linux cross-compile)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cross-compile dylib for iOS
      run: |
        # Download prebuilt iOS toolchain
        wget -q https://github.com/raspberrypi/pico-sdk-tools/releases/download/v1.5.1/cctools-port.tar.xz -O /tmp/tools.tar.xz 2>/dev/null || true
        # Alternative: use clang with arm64 target
        sudo apt-get update -qq && sudo apt-get install -y -qq clang 2>/dev/null
        # Compile for arm64 iOS
        clang -target arm64-apple-ios13.0 -dynamiclib           -isysroot /dev/null           -framework UIKit -framework WebKit -framework Foundation           -fobjc-arc           -o Tweak.dylib tweak/Tweak.xm           -Xlinker -undefined -Xlinker dynamic_lookup           2>&1 || echo 'Linux cross-compile not possible without iOS SDK'
        # Fallback: just create placeholder explaining this needs macOS
        echo 'This tweak requires macOS to compile. Linux cross-compilation for iOS dylib is not supported without Apple SDK.' > README.txt
    - uses: actions/upload-artifact@v4
      with:
        name: tweak-info
        path: README.txt
