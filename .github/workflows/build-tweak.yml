name: Build Captcha Bypass Tweak
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build dylib (direct clang)
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        clang -arch arm64 -isysroot $SDK -dynamiclib           -F $SDK/System/Library/Frameworks           -framework UIKit -framework WebKit -framework Foundation           -o Tweak.dylib tweak/Tweak.xm           -Xlinker -undefined -Xlinker dynamic_lookup
        ls -la Tweak.dylib
        file Tweak.dylib
    - uses: actions/upload-artifact@v4
      with:
        name: captcha-bypass-dylib
        path: Tweak.dylib
