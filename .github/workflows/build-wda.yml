name: Build WDA A9
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with: {repository: appium/WebDriverAgent, ref: v10.5.4}
    - run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version
    - run: xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -configuration Release -sdk iphoneos -derivedDataPath ./build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO build
    - run: |
        APP=$$(find ./build -name WebDriverAgentRunner-Runner.app -type d | head -1)
        mkdir -p Payload && cp -R $$APP Payload/
        zip -r WDA_A9_iOS15.ipa Payload/
    - uses: actions/upload-artifact@v4
      with: {name: WDA_A9_iOS15, path: WDA_A9_iOS15.ipa}
